<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Agenda completa de perros y paseadores asignados - DogMy 7.8">
    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="manifest.json">
    <title>Agenda de Paseos - DogMy 7.8</title>
    
    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="style.css">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe600, #7ed957);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .contenedor { width: 100%; display: flex; justify-content: center; }
        .tarjeta {
            width: 100%;
            max-width: 440px;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25);
            text-align: center;
        }
        h1 { color: #2e7d32; margin-bottom: 5px; font-size: 24px; }
        .subtitulo { color: #666; margin-bottom: 15px; font-size: 14px; }
        hr { border: 0; height: 1px; background: #eee; margin: 15px 0; }
        
        .select-filtro {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #2e7d32;
            border-radius: 12px;
            font-size: 15px;
            color: #333;
            background-color: #f9f9f9;
            outline: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .select-filtro:focus {
            background-color: #fff;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.4);
        }
        
        .acciones-agenda {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #1b5e20; }
        
        .btn-secundario {
            background: #666 !important;
        }
        .btn-secundario:hover { background: #444 !important; }
    </style>
</head>
<body>
<div class="contenedor">
    <main class="tarjeta">

        <h1>📅 Agenda de Paseos</h1>
        <p class="subtitulo">Mascotas y asignaciones registradas</p>

        <hr>

        <div id="filtroAgenda" style="margin-bottom: 18px;">
            <select id="filtroPaseador" class="select-filtro" onchange="filtrarAgenda()">
                <option value="">🔍 Todos los paseadores</option>
            </select>
        </div>

        <div id="listaAgenda">
            <p style="color:#666; font-size:14px; padding:20px 0;">Cargando agenda de mascotas...</p>
        </div>

        <div class="acciones-agenda">
            <button onclick="window.location.href='registro.html?tipo=cliente'">🐶 Registrar Cliente + Perro</button>
            <button onclick="history.back()" class="btn-secundario">⬅ Volver</button>
        </div>

    </main>
</div>

<!-- Script Principal Firebase -->
<script type="module" src="script.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
