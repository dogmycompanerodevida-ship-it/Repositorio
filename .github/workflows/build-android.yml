name: Compilar APK de Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm install

      - name: Preparar carpeta www con los archivos de la app
        run: |
          mkdir -p www
          cp -v admin.html agenda.html cliente.html firebase-config.js \
                icon-192.png icon-512.png index.html lista_clientes.html \
                logo.jpg manifest.json paseador.html registro.html \
                script.js style.css sw.js www/
          echo "--- Contenido final de www/ ---"
          ls -la www/

      - name: Compilar el puente de GPS nativo
        run: |
          npx esbuild gps-bridge-src.js --bundle --format=iife --outfile=www/gps-bridge.js
          echo "--- Puente de GPS compilado ---"
          ls -la www/gps-bridge.js

      - name: Agregar o actualizar la plataforma Android
        run: |
          echo "--- Version de Capacitor CLI ---"
          npx cap --version
          echo "--- Contenido de capacitor.config.json ---"
          cat capacitor.config.json
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Instalar el plugin de exencion de bateria (evita que MIUI/Magic UI maten el GPS)
        run: |
          DEST="android/app/src/main/java/com/dogmy/app"
          mkdir -p "$DEST"
          cp -v native-patch/BatteryOptimPlugin.java "$DEST/BatteryOptimPlugin.java"
          cp -v native-patch/MainActivity.java "$DEST/MainActivity.java"
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" "$MANIFEST"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />\n\n    <application#' "$MANIFEST"
          fi
          echo "--- MainActivity.java final ---"
          cat "$DEST/MainActivity.java"
          echo "--- Permiso en el manifest ---"
          grep "REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" "$MANIFEST"

      - name: Poner el logo real de DogMy como icono de la app
        run: |
          echo "--- Instalando ImageMagick ---"
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick
          echo "--- Reemplazando iconos con el logo real ---"
          find android/app/src/main/res -iname "ic_launcher*.png" | while read -r archivo; do
            medidas=$(identify -format "%wx%h" "$archivo")
            convert logo.jpg -resize "${medidas}^" -gravity center -extent "$medidas" "$archivo"
            echo "Reemplazado: $archivo ($medidas)"
          done

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Reutilizar siempre la misma llave de firma (debug keystore)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-dogmy

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Dar permisos de ejecucion a gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Compilar APK (version de prueba)
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Subir el APK como descarga
        uses: actions/upload-artifact@v4
        with:
          name: DogMy-apk-prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
