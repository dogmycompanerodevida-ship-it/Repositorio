<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DogMy Client - Panel para dueños de mascotas. Monitoreo de paseo en tiempo real, mapa GPS y evidencias.">
    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="manifest.json">
    <title>Mi Perro - DogMy 8.0</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffe600, #7ed957);
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh; 
            padding: 20px;
        }
        .contenedor { width: 100%; display: flex; justify-content: center; }
        .tarjeta {
            width: 100%; 
            max-width: 440px; 
            background: white;
            padding: 25px; 
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .25); 
            text-align: center;
        }
        h1 { color: #2e7d32; margin-bottom: 5px; font-size: 24px; }
        .subtitulo { color: #666; margin-bottom: 15px; font-size: 14px; }
        h3 { color: #2e7d32; margin: 18px 0 10px 0; text-align: left; font-size: 16px; }
        hr { border: 0; height: 1px; background: #eee; margin: 15px 0; }

        button {
            width: 100%; 
            padding: 14px; 
            margin-top: 8px;
            background: #2e7d32; 
            color: white; 
            border: none;
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: bold; 
            cursor: pointer;
            transition: background 0.2s ease;
        }
        button:hover { background: #1b5e20; }

        .estado-paseo {
            padding: 15px; 
            border-radius: 12px; 
            margin: 15px 0;
            font-weight: bold; 
            font-size: 15px;
            transition: all 0.3s ease;
        }
        .en-curso {
            background: #fff3cd; 
            color: #856404;
            border: 2px solid #ffc107; 
            animation: pulse 2s infinite;
        }
        .disponible {
            background: #d4edda; 
            color: #155724;
            border: 2px solid #28a745;
        }
        @keyframes pulse {
            0% { transform: scale(1); } 
            50% { transform: scale(1.02); } 
            100% { transform: scale(1); }
        }

        .mapa-cliente {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            border: 2px dashed #2196f3; 
            border-radius: 15px;
            min-height: 250px; 
            display: flex; 
            align-items: center;
            justify-content: center; 
            margin: 15px 0; 
            padding: 0;
            flex-direction: column; 
            overflow: hidden;
            position: relative;
        }
        .mapa-cliente p { color: #1565c0; margin: 5px 0; font-size: 14px; }

        .info-box {
            background: #f5f5f5; 
            border-radius: 12px;
            padding: 15px; 
            margin: 10px 0; 
            text-align: left;
            border: 1px solid #e0e0e0;
        }
        .info-box p { margin: 6px 0; font-size: 14px; color: #333; }

        .perro-box {
            background: #e8f5e9; 
            border-radius: 12px;
            padding: 15px; 
            margin: 10px 0; 
            text-align: left;
            border: 1px solid #c8e6c9;
        }
        .perro-box p { margin: 5px 0; font-size: 14px; color: #2e7d32; }

        .media-grid {
            display: grid; 
            gap: 10px; 
            margin: 10px 0;
        }
        .grid-fotos { grid-template-columns: repeat(2, 1fr); }
        .grid-videos { grid-template-columns: 1fr; }
        .media-placeholder { grid-column: 1 / -1; color: #666; text-align: center; font-size: 14px; padding: 10px 0; }

        .cerrar { background: #d32f2f !important; margin-top: 20px; }
        .cerrar:hover { background: #b71c1c !important; }

        /* Marcador de perrito caminando en el mapa (estilo Uber) */
        .marcador-perro-caminando {
            font-size: 26px;
            text-align: center;
            line-height: 38px;
            width: 38px;
            height: 38px;
            background: #fff;
            border: 3px solid #2e7d32;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            --flip: 1;
            animation: caminar 0.6s ease-in-out infinite alternate;
        }
        @keyframes caminar {
            0% { transform: translateY(0) scaleX(var(--flip)); }
            100% { transform: translateY(-4px) scaleX(var(--flip)); }
        }
    </style>
</head>
<body>
<div class="contenedor">
    <main class="tarjeta">

        <h1>🐶 Mi Perro</h1>
        <p class="subtitulo" id="nombreCliente">Bienvenido</p>

        <div id="estadoPaseo" class="estado-paseo disponible">
            🟢 Tu perro está en casa
        </div>

        <div class="mapa-cliente" id="mapaCliente">
            <p style="font-size:50px; margin-bottom:5px;">🏠</p>
            <p>Esperando inicio de paseo...</p>
        </div>

        <p id="infoUbicacion" style="color:#666; font-size:13px; margin-bottom:10px;"></p>

        <hr>

        <h3>📋 Mis Datos</h3>
        <div class="info-box" id="misDatos">
            <p style="color:#666;">Cargando perfil...</p>
        </div>

        <hr>

        <h3>🐕 Mi Mascota</h3>
        <div id="misPerros">
            <p style="color:#666;">Cargando datos del perro...</p>
        </div>

        <hr>

        <h3>📊 Estadísticas</h3>
        <div id="estadisticasCliente">
            <p style="color:#666; font-size:14px; text-align:left;">Cargando historial...</p>
        </div>

        <hr>

        <h3>📷 Fotos del Paseo</h3>
        <div id="fotosCliente" class="media-grid grid-fotos">
            <p class="media-placeholder">Cargando fotos...</p>
        </div>

        <button onclick="cerrarSesion()" class="cerrar">🚪 Cerrar Sesión</button>

    </main>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<!-- Script Principal Firebase -->
<script type="module" src="script.js"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
